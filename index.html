<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Expense Tracker</h1>
    <p>Track where does your money is getting spended </p>
    <form id="expense-form">
        <input 
        type="text" 
        id="expense-name"
        placeholder="what did you spend on the money?"
        required>

        <input 
        type="number"
        id="expense-amount"
        placeholder="What is the amount you spent"
        step="0.01"
        min="0.01"
        required>

        <input
        type="date"
        id="expense-date"
        required>


        <button type="submit" id="submit-button">Add Expense</button>
        <button type="button" id="cancel-edit-button" hidden>Cancel Edit </button>

        <select id="expense-category" required>
            <option value="">Choose a category</option>
            <option value="Food">Food</option>
            <option value="Transportation">Transportation</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Other">Other</option>
            
        </select>

    </form>

    <p id="form-error" role="alert"></p> 

    <h2>Spending Summary</h2>
    <div id="category-summary"> </div>
    <div id="category-chart"></div>

    

    <h2>Monthly Spending</h2>
    <div id="monthly-summary"> </div>
     

    <h2>My Expenses</h2>
    <select id="category-filter">
        <option value="All">All categories</option>
        <option value="Food">Food</option>
        <option value="Transportation">Transportation</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Shopping">Shopping</option>
        <option value="Bills">Bills</option>
        <option value="Other">Other</option>

        <input
        type="date"
        id="start-date-filter">

        <input
        type="date"
        id="end-date-filter">


        
    </select>
    <ul id="expense-list">

        
    </ul>

    <h3>Total: <span id="total-amount">0.00</span></h3>
    <p id="expense-count">
        Number of expenses: 0
    </p>

    

    <script src="script.js"></script>
</body>
</html>
